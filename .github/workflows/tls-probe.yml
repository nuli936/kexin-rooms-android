name: Probe school TLS with Apple URLSession
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Fetch public login page with system TLS validation
        run: |
          cat > /tmp/kexin_tls_probe.swift <<'SWIFT'
          import Foundation
          let url = URL(string: "https://jwglxxfwpt.hebeu.edu.cn/xtgl/login_slogin.html")!
          var request = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalCacheData, timeoutInterval: 20)
          request.httpMethod = "GET"
          let done = DispatchSemaphore(value: 0)
          URLSession(configuration: .ephemeral).dataTask(with: request) { data, response, error in
              if let error = error as NSError? {
                  print("error domain=\(error.domain) code=\(error.code) description=\(error.localizedDescription)")
                  if let underlying = error.userInfo[NSUnderlyingErrorKey] as? NSError {
                      print("underlying domain=\(underlying.domain) code=\(underlying.code)")
                  }
              } else if let response = response as? HTTPURLResponse {
                  print("status=\(response.statusCode) bytes=\(data?.count ?? 0)")
              } else {
                  print("no HTTP response")
              }
              done.signal()
          }.resume()
          _ = done.wait(timeout: .now() + 30)
          SWIFT
          swift /tmp/kexin_tls_probe.swift
